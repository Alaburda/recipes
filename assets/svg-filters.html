<!-- Filter definitions the pages reach for by id. The SVG is zero-sized so it
     never takes up space. Referenced as filter: url(#deckle) from an inline
     style attribute -- see the note in assets/theme.scss for why not from CSS. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Roughens an edge, the way a wash runs out at the edge of the paper. -->
    <filter id="deckle" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.035" numOctaves="4"
                    seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
