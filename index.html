<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<meta name="description" content="A box of favourite recipes.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23C8102E'/%3E%3Cpath d='M16 7V2M16 7l5-3' stroke='%231E9B74' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="masthead">
  <h1>Recipes</h1>
</header>

<div class="searchbar">
  <div class="field">
    <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Search recipes" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="search" aria-label="Search recipes" aria-controls="list">
    <button id="clear" type="button" class="clear" hidden aria-label="Clear search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<main>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden></p>
</main>

<div id="scrim" class="scrim" hidden></div>

<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <button id="grab" type="button" class="grab" aria-label="Close recipe"><span></span></button>

  <div class="sheet-head">
    <div class="sheet-heading">
      <h2 id="sheet-title"></h2>
      <p id="sheet-meta" class="sheet-meta"></p>
    </div>
    <button id="close" type="button" class="close" aria-label="Close recipe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="sheet-body" class="sheet-body"></div>

  <div class="sheet-actions">
    <button id="copy" type="button" class="action">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copy-label">Copy</span>
    </button>
    <button id="share" type="button" class="action">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M12 4 8 8M12 4l4 4"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      <span id="share-label">Share</span>
    </button>
  </div>
</section>

<script src="assets/app.js"></script>
</body>
</html>
